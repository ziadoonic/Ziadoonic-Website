<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ziadoonic — قريباً</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: #0a1d38;
    color: #ffffff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wrap {
    width: 100%;
    max-width: 820px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo { width: 150px; height: auto; display: block; }
  .brand {
    margin-top: 58px;
    font-size: 58px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.5px;
    color: #fff;
    direction: ltr;
  }
  .brand .accent { color: #48b8e8; }
  .tagline {
    margin-top: 20px;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 5.5px;
    color: #8e9eb2;
    direction: ltr;
  }
  .desc {
    margin-top: 34px;
    font-size: 22px;
    font-weight: 400;
    line-height: 2;
    color: #ffffff;
  }
  .cta {
    margin-top: 38px;
    display: inline-block;
    background: #48b8e8;
    color: #0a1d38;
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
    border: none;
    border-radius: 999px;
    padding: 15px 72px;
    min-width: 300px;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .cta:hover { background: #5cc2ec; transform: translateY(-1px); }
  .social {
    margin-top: 52px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .social a {
    text-decoration: none;
    color: #a7b4c4;
    font-size: 16px;
    font-weight: 400;
    border: 1px solid #27405e;
    border-radius: 999px;
    padding: 10px 28px;
    min-width: 110px;
    transition: border-color .15s ease, color .15s ease;
  }
  .social a:hover { border-color: #48b8e8; color: #fff; }
  footer {
    margin-top: 62px;
    font-size: 14px;
    font-weight: 300;
    color: #5f7388;
    direction: ltr;
  }
  @media (max-width: 560px) {
    .wrap { padding: 32px 20px; }
    .brand { font-size: 42px; }
    .tagline { font-size: 12px; letter-spacing: 4px; }
    .desc { font-size: 18px; }
    .cta { min-width: 0; width: 100%; max-width: 320px; padding: 14px 20px; }
    .social { gap: 10px; }
    .social a { padding: 9px 20px; min-width: 0; font-size: 15px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <!-- Logo -->
    <img class="logo" src="logo-mark-transparent-white-1024.png" alt="Ziadoonic logo" />

    <h1 class="brand">ZIADOON<span class="accent">IC</span></h1>
    <p class="tagline">BUILT BY ZIADOON</p>

    <p class="desc">
      أنظمة وتطبيقات | أول إصدار قريباً.
    </p>

    <a class="cta" href="https://wa.me/" target="_blank" rel="noopener">تواصل واتساب</a>

    <nav class="social">
      <a href="#" target="_blank" rel="noopener">فيسبوك</a>
      <a href="#" target="_blank" rel="noopener">تيك توك</a>
      <a href="#" target="_blank" rel="noopener">انستغرام</a>
      <a href="#" target="_blank" rel="noopener">يوتيوب</a>
      <a href="#" target="_blank" rel="noopener">تيليجرام</a>
    </nav>

    <footer>Ziadoonic © 2026</footer>
  </main>
</body>
</html>
